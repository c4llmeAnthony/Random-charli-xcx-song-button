<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>BRAT BUTTON</title>
</head>
<body>
    <div class="container">
        <!-- Kontener chroniący rozciągnięty tekst przed wychodzeniem poza ekran -->
        <div class="h1-wrapper">
            <h1>BRAT BUTTON</h1>
        </div>
        
        <!-- Przycisk losujący utwór -->
        <button id="bratButton">Random charli xcx song</button>
        
        <!-- Element, w którym wyświetli się nazwa piosenki -->
        <p id="message"></p>
        
        <!-- Ukryty odtwarzacz audio obsługujący pliki mp3 -->
        <audio id="audioPlayer"></audio>
    </div>

    <!-- Połączenie z plikiem JavaScript -->
    <script src="script.js"></script>
</body>
</html>
